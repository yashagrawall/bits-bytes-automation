services:
  bits-bytes-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bits-bytes-engine
    restart: unless-stopped

    ports:
      - "127.0.0.1:8765:8765"

    env_file:
      - path: ./.env
        required: false

    environment:
      - TZ=Asia/Kolkata
      - ENABLE_DAEMON_SCHEDULER=${ENABLE_DAEMON_SCHEDULER:-false}
      - ENABLE_LLM_CAPTIONS=${ENABLE_LLM_CAPTIONS:-false}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config:/app/config
